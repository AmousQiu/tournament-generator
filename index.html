<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Tournament Generator</h1>
        <p class="subtitle">Quick home tournaments for 2-32 players.</p>
        <div id="setup-section">
            <h2>Setup Tournament</h2>
            <div id="players-input">
                <label for="player-count">Number of Players:</label>
                <input type="number" id="player-count" min="2" max="32" value="4">
                <button id="generate-player-fields">Generate Fields</button>
            </div>
            <div id="player-names"></div>
            <label for="tournament-type">Tournament Type:</label>
            <select id="tournament-type">
                <option value="single">Single Elimination</option>
                <option value="double">Double Elimination</option>
                <option value="round-robin">Round Robin</option>
                <option value="swiss">Swiss System</option>
            </select>
            <button id="generate-bracket">Generate Tournament</button>
        </div>
        <div id="bracket-section" class="hidden">
            <h2 id="view-title">Bracket</h2>
            <p id="tournament-note" class="note"></p>
            <div id="bracket-display"></div>
            <div id="standings-display"></div>
            <div id="controls">
                <button id="export-btn">Export</button>
                <button id="import-btn">Import</button>
                <input type="file" id="import-file" accept=".json" style="display: none;">
                <button id="reset-btn">Reset</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
